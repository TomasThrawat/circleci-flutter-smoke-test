version: 2.1

jobs:
  build-android:
    docker:
      - image: cimg/android:2025.01.1
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install Flutter SDK
          command: |
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> "$BASH_ENV"
            export PATH="$HOME/flutter/bin:$PATH"
            flutter --version
            yes | flutter doctor --android-licenses || true
      - run:
          name: Generate Android platform files
          command: flutter create --platforms=android .
      - restore_cache:
          keys:
            - flutter-pub-v1-{{ checksum "pubspec.yaml" }}
            - flutter-pub-v1-
      - run:
          name: Resolve dependencies
          command: flutter pub get
      - save_cache:
          key: flutter-pub-v1-{{ checksum "pubspec.yaml" }}
          paths:
            - ~/.pub-cache
      - run:
          name: Analyze and test
          command: |
            flutter analyze
            flutter test
      - run:
          name: Build ARM64 APK
          command: flutter build apk --release --target-platform android-arm64
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
          destination: flutter-smoke-test-arm64.apk

workflows:
  build:
    jobs:
      - build-android
